# Локальный демостенд (ветка deploy/local-demo). Отдельный Compose-проект и
# отдельные порты, чтобы не пересекаться с рабочим окружением upivo.
name: upivo-demo
x-backend: &backend
  build: ./backend
  env_file: .env
  environment: &environment
    # Заглушек пароля и секрета здесь нет: пустые значения останавливают config,
    # чтобы стенд не поднялся с dev-доступами. Пароль должен быть пригоден для URL.
    DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-upivo_demo}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env — например, openssl rand -hex 32}@postgres:5432/${POSTGRES_DB:-upivo_demo}"
    REDIS_URL: redis://redis:6379/0
    APP_HOST: 0.0.0.0
    APP_PORT: 8000
    AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET:?Задайте AUTH_TOKEN_SECRET в .env — не менее 32 символов, например openssl rand -hex 32}"
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upivo_demo}
      POSTGRES_USER: ${POSTGRES_USER:-upivo_demo}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env — например, openssl rand -hex 32}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
  api:
    <<: *backend
    # --root-path /upivo: Swagger открывается через общий шлюз по префиксу,
    # --proxy-headers и forwarded-allow-ips — доверие заголовкам шлюза.
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/upivo", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Scheduled worker (ITD-84): зависит от готовности PostgreSQL, Redis и
  # применённых миграций, иначе первый проход упадёт на отсутствующих таблицах.
  worker:
    <<: *backend
    profiles: ["workers"]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  # Один экземпляр Beat на расписание: не масштабируйте сервис, иначе задачи
  # будут поставлены несколько раз.
  beat:
    <<: *backend
    profiles: ["workers"]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
