name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: upivo
          POSTGRES_PASSWORD: upivo
          POSTGRES_DB: upivo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U upivo -d upivo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://upivo:upivo@localhost:5432/upivo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - name: Database health smoke
        run: |
          uv run python -c 'from fastapi.testclient import TestClient; from app.main import app; client = TestClient(app); response = client.get("/health/db"); assert response.status_code == 200, response.text'
