name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: upivo
          POSTGRES_PASSWORD: upivo
          POSTGRES_DB: itd17_cluster_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U upivo -d itd17_cluster_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ITD84_TEST_DATABASE_URL: postgresql+psycopg://upivo:upivo@localhost:5432/itd17_cluster_test_ci
      ITD86_TEST_DATABASE_URL: postgresql+psycopg://upivo:upivo@localhost:5432/itd86_interests_test_ci
      ITD89_TEST_DATABASE_URL: postgresql+psycopg://upivo:upivo@localhost:5432/itd89_feedback_test_ci
      SPRINT3_TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+psycopg://upivo:upivo@localhost:5432/itd17_cluster_test_ci
      ITD17_TEST_DATABASE_URL: postgresql+psycopg://upivo:upivo@localhost:5432/itd17_cluster_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check --config pyproject.toml . ../start.py
      - run: uv run alembic upgrade head
      - name: Prepare isolated test databases
        run: |
          uv run python - <<'PYTHON'
          import psycopg
          with psycopg.connect("postgresql://upivo:upivo@localhost:5432/itd17_cluster_test_ci", autocommit=True) as connection:
              connection.execute("CREATE DATABASE itd86_interests_test_ci")
              connection.execute("CREATE DATABASE itd89_feedback_test_ci")
          PYTHON
      - run: uv run pytest
      - run: uv run alembic check
      - name: Database health smoke
        run: |
          uv run python -c 'from fastapi.testclient import TestClient; from app.main import app; client = TestClient(app); response = client.get("/health/db"); assert response.status_code == 200, response.text'
