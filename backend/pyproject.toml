[project]
name = "upivo-backend"
version = "0.1.0"
description = "Upivo backend infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
 "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3",
 "telethon>=1.36,<2", "httpx>=0.27,<1", "trafilatura>=2,<3",
 "beautifulsoup4>=4.12,<5", "feedparser>=6,<7", "redis>=5,<8", "celery>=5.4,<6",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
