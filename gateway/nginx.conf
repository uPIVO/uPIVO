# Общий шлюз: uPIVO под префиксом /upivo, существующий сервис — по прежним путям.
# Upstream-адреса рассчитаны на Docker Desktop: host.docker.internal — это Mac.

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    # Схему сообщает ngrok; при локальном запуске без туннеля остаётся http.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # WebSocket: заголовки нужны и существующему сервису, и uPIVO.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # В логи доступа попадали бы query-строки с токенами, поэтому он выключен.
    access_log  off;
    error_log   /var/log/nginx/error.log warn;

    # Общие настройки проксирования: заголовки, потоковая передача, таймауты.
    # Authorization не переписывается и уходит выше по умолчанию.
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Ограничения размера тела раньше не было, поэтому шлюз его не вводит.
    client_max_body_size 0;

    server {
        listen      8080;
        server_name _;
        # Относительные Location: без этого nginx добавляет схему и локальный порт.
        absolute_redirect off;

        # Относительный редирект с сохранением метода: схема и порт не раскрываются.
        location = /upivo {
            return 308 /upivo/;
        }

        # ^~ закрепляет префикс /upivo за uPIVO, regex-локации не проверяются.
        location ^~ /upivo/ {
            # Слэш в конце proxy_pass снимает префикс /upivo из пути запроса.
            proxy_pass http://host.docker.internal:18000/;
        }

        # Все остальные пути — существующий сервис, путь и query не меняются.
        location / {
            proxy_pass http://host.docker.internal:8765;
        }
    }
}
