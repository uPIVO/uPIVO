# Общий шлюз демостенда. Отдельный Compose-проект: у него собственный жизненный
# цикл, он не останавливается вместе с upivo-demo и не зависит от его сети.
name: upivo-gateway
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      # Публикуется только локальный адрес Mac: к нему подключается ngrok.
      - "127.0.0.1:18080:8080"
    volumes:
      # Конфигурация монтируется только на чтение, чтобы правки шли через репозиторий.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
